name: Snapshot PUMA v2.2 source
on:
  push:
    paths:
      - "release/snapshot-v22.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v2.2 /tmp/puma_v22
          mkdir -p /tmp/puma_v22 source/v2.2
          unzip -q releases/PUMA_STOCK_PRO_v2.2_UPDATE.zip -d /tmp/puma_v22
          cp -r /tmp/puma_v22/PUMA_STOCK_PRO_v2.2/puma_trader source/v2.2/
          cp /tmp/puma_v22/PUMA_STOCK_PRO_v2.2/app.py source/v2.2/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v2.2
          git commit -m "Snapshot PUMA v2.2 source"
          git push
