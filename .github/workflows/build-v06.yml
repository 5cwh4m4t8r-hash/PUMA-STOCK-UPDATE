name: Build PUMA update package

on:
  push:
    paths:
      - "payload/READY_v0.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check marker
        id: marker
        shell: bash
        run: |
          if [ -f payload/READY_v0.6 ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild ZIP and publish manifest
        if: steps.marker.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cat payload/v0.6.part*.b64 > /tmp/puma_v06.b64
          base64 -d /tmp/puma_v06.b64 > releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "0.6.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip",
            "notes": "v0.6: 과거 차트 탐색/구간분석, 단타·역매공파·밥그릇3번 통합 전략판, 밥그릇3번 엔진 추가.",
            "sha256": "$SHA"
          }
          EOF
          rm -f payload/v0.6.part*.b64 payload/READY_v0.6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip manifest.json payload
          git commit -m "Publish PUMA STOCK PRO v0.6.0"
          git push
