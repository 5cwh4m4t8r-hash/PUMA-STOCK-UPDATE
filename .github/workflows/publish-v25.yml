name: Publish PUMA v2.5

on:
  push:
    paths:
      - "release/v2.5.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v2.5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v2.4_UPDATE.zip -d work
          cp source_build/v2.5/test_performance_v25.py work/PUMA_STOCK_PRO_v2.4/tests/test_performance_v25.py
          python scripts/upgrade_v24_to_v25.py

          cd work/PUMA_STOCK_PRO_v2.4
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'class FocusDataThread(QThread)' puma_trader/ui.py
          grep -q '백그라운드에서 불러오는 중' puma_trader/ui.py
          grep -q 'strength < breakout_req' puma_trader/market_path.py
          grep -q 'clear_market_path_cache' puma_trader/market_path.py
          grep -q '_PATH_CACHE_MAX = 32' puma_trader/market_path.py
          grep -q 'SWING 분석기가 이미 계산한 값이면 그대로 재사용' puma_trader/ui.py
          grep -q 'CURRENT_VERSION = "2.5.0"' puma_trader/updater.py

          # Extra smoke benchmark: 1000 quiet candles should finish quickly because
          # no expensive box scan runs until a 300% volume candidate exists.
          PYTHONPATH=. python - <<'PY'
          import time
          from puma_trader.market_path import analyze_market_path, clear_market_path_cache
          from puma_trader.swing import SwingSettings
          rows=[]
          p=100.0
          for i in range(1000):
              p += 0.05 if i%6<3 else -0.04
              rows.append({"date":str(i),"open":p-.1,"high":p+1,"low":p-1,"close":p,"volume":1000})
          clear_market_path_cache()
          t=time.perf_counter()
          analyze_market_path(rows,SwingSettings())
          elapsed=time.perf_counter()-t
          print(f"market_path 1000 bars: {elapsed:.4f}s")
          assert elapsed < 2.0
          PY

          cd ../..
          mv work/PUMA_STOCK_PRO_v2.4 work/PUMA_STOCK_PRO_v2.5

          cat > work/PUMA_STOCK_PRO_v2.5/CHANGELOG_v2.5.txt <<'EOF'
          PUMA STOCK PRO v2.5.0

          응답없음/속도 수정
          - 키움 종목정보, 5분봉, 일봉 REST 호출을 GUI 메인 스레드에서 분리
          - REST 통신 중에도 창 이동/탭 전환/스크롤 등 UI 이벤트 처리 가능
          - 별도 작업 스레드에서는 독립 requests.Session을 사용해 UI/조건검색 통신과 충돌 최소화
          - 연속 클릭 시 로딩 작업을 무한 중첩하지 않고 현재 요청 종료 후 최신 요청만 이어서 처리
          - 같은 종목/같은 페이지 데이터는 8초간 재사용
          - 통합트레이딩에서 이미 받은 5분봉/일봉을 단타분석 탭에서 다시 REST 호출하지 않고 재사용

          박스권/돌파 분석 성능
          - v2.2~v2.4의 핵심 병목 수정
          - 이전: 거의 모든 봉마다 10~160봉 이상의 여러 박스 후보를 정렬/검사한 뒤 거래량을 확인
          - v2.5: 먼저 거래량강도 300% 후보를 싸게 검사하고, 후보봉에서만 무거운 박스/전고점 탐색 실행
          - 동일 end_idx 구조 탐색은 한 분석 안에서 캐시
          - 동일 캔들+동일 설정의 공통경로 결과는 최대 32개 LRU형 캐시로 재사용
          - 스윙 분석기가 이미 계산한 core_path/path_breakout/path_pullback/path_rebreakout은 UI가 다시 계산하지 않음

          정확도
          - 공구리, 돌파, 눌림, 재돌파의 v2.3 기준 자체는 유지
          - 속도를 위해 판단 기준을 낮추지 않음
          - 확률/수박/화살표 표시 로직 유지
          EOF

          rm -f releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip PUMA_STOCK_PRO_v2.5
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "2.5.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip",
            "notes": "v2.5: 응답없음/속도 긴급 수정. 키움 REST 호출을 GUI 스레드에서 분리하고, 거래량 300% 후보봉에서만 무거운 박스탐색을 수행. 동일 공통경로 분석 캐시 및 단타탭 데이터 재사용으로 중복 계산/통신 제거.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v2.5.0"
          git push
