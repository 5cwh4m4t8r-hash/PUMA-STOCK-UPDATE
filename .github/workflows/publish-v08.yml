name: Publish PUMA v0.8

on:
  push:
    paths:
      - "release/v0.8.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.8 from v0.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v0.7_UPDATE.zip -d work
          python scripts/upgrade_v07_to_v08.py
          cd work/PUMA_STOCK_PRO_v0.7
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q
          cd ../..
          mv work/PUMA_STOCK_PRO_v0.7 work/PUMA_STOCK_PRO_v0.8
          cat > work/PUMA_STOCK_PRO_v0.8/CHANGELOG_v0.8.txt <<'EOF'
          PUMA STOCK PRO v0.8.0

          - 현재 Windows 해상도에 맞춰 프로그램 시작 시 최대화
          - 탭 폭/통합 트레이딩 3열 레이아웃 해상도 최적화
          - 통합 트레이딩 조건검색 종목 클릭 즉시 선택 버그 수정
          - 선택 종목을 전략 상세설정 / 고급 주문 / 역매공파 상세에 즉시 연동
          - 전략 상세설정 진입 시 선택종목 분봉 신호 즉시 재분석
          - 역매공파 상세 진입 시 선택종목 일봉 자동 불러오기
          - 고급 주문 진입 시 선택종목 현재가 자동 조회
          EOF
          rm -f releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip PUMA_STOCK_PRO_v0.8
          cd ..
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "0.8.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip",
            "notes": "v0.8: 해상도 최적화/최대화 고정 시작, 통합 트레이딩 종목 클릭 즉시 표시 버그 수정, 선택종목을 전략 상세·고급주문·역매공파 상세에 즉시 연동.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v0.8.0"
          git push
