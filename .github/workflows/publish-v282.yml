name: Publish PUMA STOCK PRO v2.8.2

on:
  push:
    branches: [main]
    paths:
      - 'source_build/v2.8.2/**'
      - '.github/workflows/publish-v282.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/source_build/v2.8.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source_build/v2.8.2/requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r source_build/v2.8.2/requirements.txt pytest
      - name: Compile all Python sources
        run: python -m compileall -q source_build/v2.8.2
      - name: Run full test suite
        run: python -m pytest -q source_build/v2.8.2/tests
      - name: Build update ZIP and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PUMA_STOCK_PRO_v2.8.2
          cp -a source_build/v2.8.2 /tmp/PUMA_STOCK_PRO_v2.8.2
          find /tmp/PUMA_STOCK_PRO_v2.8.2 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find /tmp/PUMA_STOCK_PRO_v2.8.2 -name '*.pyc' -delete
          mkdir -p releases release
          rm -f releases/PUMA_STOCK_PRO_v2.8.2_UPDATE.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/PUMA_STOCK_PRO_v2.8.2_UPDATE.zip" PUMA_STOCK_PRO_v2.8.2)
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.8.2_UPDATE.zip | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']
          manifest={
              'version':'2.8.2',
              'url':'https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.8.2_UPDATE.zip',
              'notes':'v2.8.2: 모바일 실전 잠금 최초 1회 방식. 모바일에서 PUMA LIVE를 한 번 입력하면 수동주문/자동매매 모두 재확인 없이 사용하며 재시작 후에도 유지됩니다.',
              'sha256':sha,
          }
          body=json.dumps(manifest,ensure_ascii=False,indent=2)+chr(10)
          open('manifest.json','w',encoding='utf-8').write(body)
          open('manifest-v271.json','w',encoding='utf-8').write(body)
          release={
              'version':'2.8.2',
              'sha256':sha,
              'tests':'full pytest suite including persistent one-time mobile live unlock',
              'source':'source_build/v2.8.2',
              'features':[
                  'one-time mobile PUMA LIVE unlock',
                  'unlock persists across PUMA restarts',
                  'no repeated LIVE ORDER or LIVE START on mobile',
                  'no extra PC live unlock requirement for mobile path',
                  'shared unlock for manual orders and auto trading',
                  'token regeneration relocks mobile live trading'
              ]
          }
          open('release/v2.8.2.json','w',encoding='utf-8').write(json.dumps(release,ensure_ascii=False,indent=2)+chr(10))
          PY
      - name: Publish tested update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PUMA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/PUMA_STOCK_PRO_v2.8.2_UPDATE.zip manifest.json manifest-v271.json release/v2.8.2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish PUMA STOCK PRO v2.8.2 one-time mobile live unlock'
          git push
