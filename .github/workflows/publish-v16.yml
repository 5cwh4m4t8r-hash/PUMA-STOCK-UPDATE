name: Publish PUMA v1.6

on:
  push:
    paths:
      - "release/v1.6.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.5_UPDATE.zip -d work
          cp source_build/v1.6/watermelon_proxy.py work/PUMA_STOCK_PRO_v1.5/puma_trader/watermelon_proxy.py
          cp source_build/v1.6/probability.py work/PUMA_STOCK_PRO_v1.5/puma_trader/probability.py
          cp source_build/v1.6/test_v16.py work/PUMA_STOCK_PRO_v1.5/tests/test_v16.py
          python scripts/upgrade_v15_to_v16.py

          cd work/PUMA_STOCK_PRO_v1.5
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          # wheel audit: no raw numeric/date/time widgets and no ordinary QComboBox() remain.
          ! grep -n 'QSpinBox(' puma_trader/ui.py
          ! grep -n 'QDoubleSpinBox(' puma_trader/ui.py
          ! grep -n 'QDateEdit(' puma_trader/ui.py
          ! grep -n 'QTimeEdit(' puma_trader/ui.py
          ! grep -n 'QComboBox()' puma_trader/ui.py
          grep -q 'class NoWheelComboBox' puma_trader/ui.py
          grep -q 'class NumericComboBox(NoWheelComboBox)' puma_trader/ui.py
          grep -q 'class TimeComboBox(NoWheelComboBox)' puma_trader/ui.py
          grep -q 'class NoWheelDateEdit' puma_trader/ui.py

          grep -q 'PUMA STOCK PRO v1.6' puma_trader/ui.py
          grep -q 'PUMA 수박근사' puma_trader/ui.py
          grep -q '유사구간 확률' puma_trader/ui.py
          grep -q 'PUMA 판단' puma_trader/ui.py
          grep -q 'watermelon_stage' puma_trader/swing_chart.py
          grep -q 'estimate_from_flags' puma_trader/probability.py
          grep -q 'CURRENT_VERSION = "1.6.0"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.5 work/PUMA_STOCK_PRO_v1.6
          cat > work/PUMA_STOCK_PRO_v1.6/CHANGELOG_v1.6.txt <<'EOF'
          PUMA STOCK PRO v1.6.0

          PUMA 수박근사
          - 주식단테의 비공개 원본 수식이라고 주장하지 않는 독립 근사 모델
          - 공개 강의/차트에서 반복 관찰되는 장기이평 수렴, 224EMA 돌파/안착, 눌림,
            거래량 확장/안정, 사용자 화살표 결합을 1~3단계로 수치화
          - 기존 단순 초록/빨강 바가 아니라 실제 수박 모양의 원형 마커로 표시
          - 1단: 장기이평 수렴 + 224EMA 근접
          - 2단: 224EMA 최근 돌파 + 위 안착/눌림
          - 3단: 2단 조건 + 거래량/화살표 강화
          - 차트와 분석 상세에 'PUMA 수박근사'로 명확히 표기

          확률/진입 판단
          - 과거 동일계열 신호를 대상으로 TP-before-SL 실제 적중률 계산
          - 표본수와 Wilson 95% 구간 표시
          - 표본 부족이면 임의 확률을 만들지 않고 '판단 유보'
          - 현재 전략 점수 + 현재 신호 활성 + 과거 적중률을 결합해
            '진입 적합도 높음 / 조건부 진입 검토 / 관망 우세 / 판단 유보' 표시
          - 확률 기준과 TP/SL/평가기간을 함께 표시

          마우스 휠 전수 점검
          - 모든 일반 콤보박스를 NoWheelComboBox로 교체
          - 숫자 직접입력/드롭다운 NumericComboBox 휠 차단
          - 시간 드롭다운 TimeComboBox 휠 차단
          - 날짜 NoWheelDateEdit 휠 차단
          - QSpinBox/QDoubleSpinBox/QTimeEdit/QDateEdit 직접 사용 없음
          - 차트의 마우스 휠 확대/축소만 의도적으로 유지
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip PUMA_STOCK_PRO_v1.6
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.6.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip",
            "notes": "v1.6: 공개 차트/강의 기반 PUMA 수박근사 1~3단계와 수박형 마커 추가, 과거 유사신호 실측 적중률/95%구간/PUMA 진입판단 추가, 모든 입력 콤보·숫자·시간·날짜 마우스휠 값변경 전수 차단.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.6_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.6.0"
          git push
