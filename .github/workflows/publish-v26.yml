name: Publish PUMA v2.6

on:
  push:
    paths:
      - "release/v2.6.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v2.6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v2.5_UPDATE.zip -d work
          cp source_build/v2.5/test_performance_v25.py work/PUMA_STOCK_PRO_v2.5/tests/test_performance_v25.py
          python scripts/upgrade_v25_to_v26.py

          cd work/PUMA_STOCK_PRO_v2.5
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'class FocusAnalysisThread(QThread)' puma_trader/ui.py
          grep -q 'class DantaAnalysisThread(QThread)' puma_trader/ui.py
          grep -q 'Run ALL CPU-heavy chart analysis outside the GUI event loop' puma_trader/ui.py
          grep -q '_start_focus_analysis' puma_trader/ui.py
          grep -q '_start_danta_background' puma_trader/ui.py
          grep -q 'coarse scan, then refines' puma_trader/market_path.py
          ! grep -q 'self._apply_focus_loaded(cached)' puma_trader/ui.py
          grep -q 'CURRENT_VERSION = "2.6.0"' puma_trader/updater.py

          # CPU smoke benchmark with repeated high-volume candidates.
          PYTHONPATH=. python - <<'PY'
          import time
          from puma_trader.market_path import analyze_market_path, clear_market_path_cache
          from puma_trader.swing import SwingSettings

          rows=[]
          p=100.0
          for i in range(1200):
              p += 0.12 if i%10<5 else -0.10
              v = 1000
              if i > 30 and i % 37 == 0:
                  v = 4200
              rows.append({
                  "date":str(i),"open":p-.15,"high":p+1.2,"low":p-1.2,
                  "close":p,"volume":v
              })

          clear_market_path_cache()
          t=time.perf_counter()
          a=analyze_market_path(rows,SwingSettings())
          first=time.perf_counter()-t
          t=time.perf_counter()
          b=analyze_market_path(rows,SwingSettings())
          cached=time.perf_counter()-t
          print(f"market_path 1200 bars first={first:.4f}s cached={cached:.6f}s")
          assert first < 3.0
          assert cached < 0.25
          assert a is b
          PY

          cd ../..
          mv work/PUMA_STOCK_PRO_v2.5 work/PUMA_STOCK_PRO_v2.6

          cat > work/PUMA_STOCK_PRO_v2.6/CHANGELOG_v2.6.txt <<'EOF'
          PUMA STOCK PRO v2.6.0

          응답없음 2차 긴급 수정

          GUI 메인스레드
          - v2.5는 REST 통신만 백그라운드로 보냈고, 데이터 수신 직후
            스윙/중장기/단타/수박/확률/박스 계산을 다시 GUI 스레드에서 실행하는 문제가 남아 있었음
          - v2.6은 CPU 분석까지 전부 별도 QThread로 이동
          - 메인 UI 스레드는 결과를 받아 화면에 그리는 작업만 수행
          - 분석 중 창 이동, 스크롤, 탭 전환, 버튼 입력이 멈추지 않도록 구조 변경

          백그라운드 분석 대상
          - 역매공파/스윙 분석
          - 밥그릇3번/중장기 분석
          - 5분봉 단타 분석
          - 공통 수급→돌파→눌림→재돌파 경로
          - 공구리 박스 탐색
          - 수박근사
          - 동일단계 과거확률/신뢰구간
          - 날짜별 단타 재분석

          중복 작업 방지
          - 종목을 연속 클릭해도 CPU 분석 작업을 무한히 쌓지 않음
          - 진행 중이면 가장 최신 요청 하나만 대기시켜 이어서 실행
          - 오래된 종목 분석 결과는 화면에 적용하지 않고 폐기
          - 통합트레이딩 분석 결과를 단타 상세탭에서 재사용

          박스 탐색 추가 고속화
          - 거래량강도 300% 후보봉 선필터 유지
          - 박스 기간 전수검사 대신 coarse scan -> 상위 후보 주변 refine 2단계 탐색
          - 지지/저항/왕복/기울기/방향성 판정 기준은 유지
          - 동일 캔들+설정 분석 캐시 유지

          정확도
          - 돌파/눌림/재돌파 판단 기준을 속도 때문에 낮추지 않음
          - 기존 화살표/수박/확률/공구리 표시 유지
          EOF

          rm -f releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip PUMA_STOCK_PRO_v2.6
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "2.6.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip",
            "notes": "v2.6: 응답없음 2차 긴급수정. REST뿐 아니라 스윙/중장기/단타/수박/확률/박스 CPU 분석 전체를 GUI 스레드 밖으로 이동. 날짜별 단타도 비동기 처리하고 박스 탐색을 coarse→refine 방식으로 추가 고속화.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v2.6_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v2.6.0"
          git push
