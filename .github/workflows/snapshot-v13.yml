name: Snapshot PUMA v1.3 source
on:
  push:
    paths:
      - "release/snapshot-v13.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v1.3 /tmp/puma_v13
          mkdir -p /tmp/puma_v13 source/v1.3
          unzip -q releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip -d /tmp/puma_v13
          cp -r /tmp/puma_v13/PUMA_STOCK_PRO_v1.3/puma_trader source/v1.3/
          cp /tmp/puma_v13/PUMA_STOCK_PRO_v1.3/app.py source/v1.3/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v1.3
          git commit -m "Snapshot PUMA v1.3 source"
          git push
