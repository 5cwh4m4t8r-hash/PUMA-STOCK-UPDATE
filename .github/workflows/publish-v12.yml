name: Publish PUMA v1.2

on:
  push:
    paths:
      - "release/v1.2.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip -d work
          cp source_build/v1.2/danta.py work/PUMA_STOCK_PRO_v1.1/puma_trader/danta.py
          cp source_build/v1.2/test_dates.py work/PUMA_STOCK_PRO_v1.1/tests/test_dates.py
          python scripts/upgrade_v11_to_v12.py

          cd work/PUMA_STOCK_PRO_v1.1
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'PUMA STOCK PRO v1.2' puma_trader/ui.py
          grep -q '단타 날짜' puma_trader/ui.py
          grep -q '전체 · 날짜 구분' puma_trader/ui.py
          grep -q 'analyze_danta_for_date' puma_trader/ui.py
          grep -q 'max_pages=4' puma_trader/ui.py
          grep -q 'Qt.DashLine' puma_trader/swing_chart.py
          grep -q 'CURRENT_VERSION = "1.2.0"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.1 work/PUMA_STOCK_PRO_v1.2
          cat > work/PUMA_STOCK_PRO_v1.2/CHANGELOG_v1.2.txt <<'EOF'
          PUMA STOCK PRO v1.2.0

          단타 5분봉 날짜 구분
          - 단타 기준 분봉은 계속 5분봉으로 고정
          - 통합 트레이딩 5분봉 화면에 거래일 선택 드롭다운 추가
          - 전체 보기에서는 거래일 경계마다 세로 점선과 MM/DD 라벨 표시
          - 특정 거래일을 선택하면 해당 날짜 5분봉만 차트에 표시
          - 전일 / 다음일 버튼으로 거래일 단위 이동
          - 단타 상세 분석 화면에도 동일 날짜 선택/전일/다음일 기능 연동
          - 메인과 단타 상세의 선택 날짜가 서로 동기화
          - 날짜별 분석 시 이전 봉은 EMA/기준선 계산 컨텍스트로 유지하고 미래 날짜 데이터는 제거
          - 과거 날짜 복기 시 일봉 거래량 비교에서도 선택일 이후 미래 일봉을 사용하지 않음
          - 키움 5분봉 조회를 continuation 최대 4페이지까지 지원해 날짜 선택 범위를 확대
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip PUMA_STOCK_PRO_v1.2
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.2.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip",
            "notes": "v1.2: 단타는 5분봉 고정 유지. 통합/단타상세에서 거래일별 선택·전일/다음일 이동, 전체 5분봉 날짜 경계선 표시, 과거 날짜 복기 시 미래 데이터 차단, 5분봉 과거 조회 범위 확대.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.2.0"
          git push
