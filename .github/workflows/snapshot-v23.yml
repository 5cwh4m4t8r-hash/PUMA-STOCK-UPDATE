name: Snapshot PUMA v2.3 source
on:
  push:
    paths:
      - "release/snapshot-v23.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v2.3 /tmp/puma_v23
          mkdir -p /tmp/puma_v23 source/v2.3
          unzip -q releases/PUMA_STOCK_PRO_v2.3_UPDATE.zip -d /tmp/puma_v23
          cp -r /tmp/puma_v23/PUMA_STOCK_PRO_v2.3/puma_trader source/v2.3/
          cp /tmp/puma_v23/PUMA_STOCK_PRO_v2.3/app.py source/v2.3/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v2.3
          git commit -m "Snapshot PUMA v2.3 source"
          git push
