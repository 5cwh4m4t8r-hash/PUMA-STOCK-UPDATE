name: Snapshot chart module
on:
  push:
    paths:
      - "release/snapshot-chart.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip -d /tmp/v08
          mkdir -p source/v0.8
          cp /tmp/v08/PUMA_STOCK_PRO_v0.8/puma_trader/swing_chart.py source/v0.8/swing_chart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v0.8/swing_chart.py
          git commit -m "Snapshot v0.8 chart module"
          git push
