name: Snapshot PUMA v0.8 source

on:
  push:
    paths:
      - "release/snapshot-v08.json"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v0.8 /tmp/puma_v08
          mkdir -p /tmp/puma_v08 source/v0.8
          unzip -q releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip -d /tmp/puma_v08
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/app.py source/v0.8/app.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/ui.py source/v0.8/ui.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/updater.py source/v0.8/updater.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/__init__.py source/v0.8/__init__.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/strategy.py source/v0.8/strategy.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/swing.py source/v0.8/swing.py
          cp /tmp/puma_v08/PUMA_STOCK_PRO_v0.8/puma_trader/bowl.py source/v0.8/bowl.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v0.8
          git commit -m "Snapshot PUMA v0.8 source"
          git push
