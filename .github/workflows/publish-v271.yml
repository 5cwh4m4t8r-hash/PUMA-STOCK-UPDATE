name: Publish PUMA STOCK PRO v2.7.1

on:
  push:
    branches: [main]
    paths:
      - 'source_build/v2.7.1/**'
      - '.github/workflows/publish-v271.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/source_build/v2.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source_build/v2.7.1/requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install -r source_build/v2.7.1/requirements.txt pytest

      - name: Compile all Python sources
        run: python -m compileall -q source_build/v2.7.1

      - name: Run full test suite
        run: python -m pytest -q source_build/v2.7.1/tests

      - name: Build update ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PUMA_STOCK_PRO_v2.7.1
          cp -a source_build/v2.7.1 /tmp/PUMA_STOCK_PRO_v2.7.1
          find /tmp/PUMA_STOCK_PRO_v2.7.1 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find /tmp/PUMA_STOCK_PRO_v2.7.1 -name '*.pyc' -delete
          mkdir -p releases release
          rm -f releases/PUMA_STOCK_PRO_v2.7.1_UPDATE.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/PUMA_STOCK_PRO_v2.7.1_UPDATE.zip" PUMA_STOCK_PRO_v2.7.1)
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.7.1_UPDATE.zip | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']
          manifest={
            'version':'2.7.1',
            'url':'https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.7.1_UPDATE.zip',
            'notes':'v2.7.1: Intel Celeron N5095A + RAM 12GB 최적화. RAM 캐시는 유지하고 CPU 동시작업·차트 렌더링·조건검색 백그라운드 경쟁을 줄였습니다. 분석 기준과 주문 로직은 변경하지 않았습니다.',
            'sha256':sha,
          }
          open('manifest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\\n')
          release={
            'version':'2.7.1',
            'sha256':sha,
            'tests':'full pytest suite',
            'source':'source_build/v2.7.1',
            'target_profile':'Intel Celeron N5095A / 12GB RAM',
          }
          open('release/v2.7.1.json','w',encoding='utf-8').write(json.dumps(release,ensure_ascii=False,indent=2)+'\\n')
          PY

      - name: Publish tested update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PUMA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/PUMA_STOCK_PRO_v2.7.1_UPDATE.zip manifest.json release/v2.7.1.json
          if git diff --cached --quiet; then
            echo 'No release changes.'
            exit 0
          fi
          git commit -m 'Publish PUMA STOCK PRO v2.7.1 N5095A optimization'
          git push
