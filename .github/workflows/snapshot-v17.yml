name: Snapshot PUMA v1.7 source
on:
  push:
    paths:
      - "release/snapshot-v17.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v1.7 /tmp/puma_v17
          mkdir -p /tmp/puma_v17 source/v1.7
          unzip -q releases/PUMA_STOCK_PRO_v1.7_UPDATE.zip -d /tmp/puma_v17
          cp -r /tmp/puma_v17/PUMA_STOCK_PRO_v1.7/puma_trader source/v1.7/
          cp /tmp/puma_v17/PUMA_STOCK_PRO_v1.7/app.py source/v1.7/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v1.7
          git commit -m "Snapshot PUMA v1.7 source"
          git push
