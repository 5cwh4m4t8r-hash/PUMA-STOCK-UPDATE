name: Publish PUMA v1.4.1

on:
  push:
    paths:
      - "release/v1.4.1.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.4.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip -d work
          python scripts/upgrade_v14_to_v141.py

          cd work/PUMA_STOCK_PRO_v1.4
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q
          grep -q "직전 봉 대비 거래량 증감 기준" puma_trader/swing_chart.py
          grep -q "volume_col = QColor('#ef4747')" puma_trader/swing_chart.py
          grep -q "volume_col = QColor('#2d77ff')" puma_trader/swing_chart.py
          grep -q 'CURRENT_VERSION = "1.4.1"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.4 work/PUMA_STOCK_PRO_v1.4.1
          cat > work/PUMA_STOCK_PRO_v1.4.1/CHANGELOG_v1.4.1.txt <<'EOF'
          PUMA STOCK PRO v1.4.1

          거래량 색상 수정
          - 캔들 색과 거래량 색을 분리
          - 거래량이 직전 봉보다 증가하면 빨강
          - 거래량이 직전 봉보다 감소하면 파랑
          - 거래량이 동일하면 회색
          - 일봉/5분봉 모두 동일 규칙 적용
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip PUMA_STOCK_PRO_v1.4.1
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.4.1",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip",
            "notes": "v1.4.1: 거래량 막대 색상 수정. 직전 봉보다 거래량 증가=빨강, 감소=파랑, 동일=회색. 캔들 등락색과 거래량 증감색을 분리.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.4.1_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.4.1"
          git push
