name: Publish PUMA v1.3

on:
  push:
    paths:
      - "release/v1.3.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.2_UPDATE.zip -d work
          python scripts/upgrade_v12_to_v13.py

          cd work/PUMA_STOCK_PRO_v1.2
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'PUMA STOCK PRO v1.3' puma_trader/ui.py
          grep -q '종목명 조회중' puma_trader/ui.py
          grep -q 'setMinimumWidth(360)' puma_trader/ui.py
          grep -q 'is_intraday = len(valid_days) > len(set(valid_days))' puma_trader/swing_chart.py
          grep -q 'CURRENT_VERSION = "1.3.0"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.2 work/PUMA_STOCK_PRO_v1.3
          cat > work/PUMA_STOCK_PRO_v1.3/CHANGELOG_v1.3.txt <<'EOF'
          PUMA STOCK PRO v1.3.0

          차트 가독성
          - 일봉 차트의 날짜 경계 세로선 제거
          - 날짜 경계선은 같은 거래일에 여러 봉이 존재하는 5분봉에서만 표시
          - 일봉은 기존 축 날짜 라벨만 유지

          조건검색 가독성
          - 통합 트레이딩 조건검색 패널 폭 확대
          - 종목명 열을 우선 확보하고 종목명 굵은 글씨/밝은 색상으로 표시
          - 종목명 전체 툴팁 제공
          - 행 높이와 헤더 폭 조정
          - 별도 조건검색 탭도 종목명 열을 넓게 표시
          - 종목명 조회를 분류 분석보다 우선 처리
          - 첫 종목명 조회는 대기 없이 즉시 실행
          - 백그라운드 분류 작업도 종목명을 함께 보완
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip PUMA_STOCK_PRO_v1.3
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.3.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip",
            "notes": "v1.3: 일봉 날짜 경계선 제거(5분봉 날짜 구분만 유지), 조건검색 종목명 열 확대/굵은 표시/조회 우선순위 개선으로 가독성 강화.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.3.0"
          git push
