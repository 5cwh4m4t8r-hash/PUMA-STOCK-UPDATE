name: Publish PUMA v0.7

on:
  push:
    paths:
      - "release/v0.7.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.7 from verified v0.6 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip -d work
          cat patches/v06_to_v07.part*.patch > /tmp/v06_to_v07.patch
          patch -p1 -d work < /tmp/v06_to_v07.patch
          rm -rf work/PUMA_STOCK_PRO_v0.6/.pytest_cache work/PUMA_STOCK_PRO_v0.6/**/__pycache__ || true
          cd work/PUMA_STOCK_PRO_v0.6
          python -m py_compile app.py puma_trader/*.py
          PYTHONPATH=. pytest -q
          cd ../..
          mv work/PUMA_STOCK_PRO_v0.6 work/PUMA_STOCK_PRO_v0.7
          rm -f releases/PUMA_STOCK_PRO_v0.7_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v0.7_UPDATE.zip PUMA_STOCK_PRO_v0.7
          cd ..
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v0.7_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "0.7.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v0.7_UPDATE.zip",
            "notes": "v0.7: 통합 트레이딩 화면을 기본 화면으로 변경, 조건검색 결과를 차트 옆에 통합, 키움 App Key/Secret Windows DPAPI 보안저장, 실행 시 자동연결, 상단 빠른연결 버튼 추가. 실전 자동연결 후에도 실전주문 잠금은 자동 해제되지 않습니다.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          rm -rf payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PUMA STOCK PRO v0.7.0"
          git push
