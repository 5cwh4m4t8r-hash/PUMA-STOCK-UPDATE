name: Publish PUMA v1.4

on:
  push:
    paths:
      - "release/v1.4.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.3_UPDATE.zip -d work
          cp source_build/v1.4/indicators.py work/PUMA_STOCK_PRO_v1.3/puma_trader/indicators.py
          cp source_build/v1.4/test_indicators.py work/PUMA_STOCK_PRO_v1.3/tests/test_indicators.py
          python scripts/upgrade_v13_to_v14.py

          cd work/PUMA_STOCK_PRO_v1.3
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'PUMA STOCK PRO v1.4' puma_trader/ui.py
          grep -q '직접 주문' puma_trader/ui.py
          grep -q '간단 이유' puma_trader/ui.py
          grep -q 'ichimoku_cloud' puma_trader/danta.py
          grep -q 'ichimoku_cloud' puma_trader/swing.py
          grep -q '일목 선행스팬1·2' puma_trader/swing_chart.py
          if grep -q 'PUMA 수박형 밴드' puma_trader/swing_chart.py; then
            echo "old fake watermelon renderer remains"
            exit 1
          fi
          grep -q 'CURRENT_VERSION = "1.4.0"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.3 work/PUMA_STOCK_PRO_v1.4
          cat > work/PUMA_STOCK_PRO_v1.4/CHANGELOG_v1.4.txt <<'EOF'
          PUMA STOCK PRO v1.4.0

          사용자 영웅문 차트 반영 1차
          - 일봉/5분봉 차트에 일목균형표 선행스팬1·2 파란 구름대 추가
          - 표준 선행스팬1: (전환선9 + 기준선26) / 2 를 26칸 선행
          - 표준 선행스팬2: 52기간 최고/최저 중간값을 26칸 선행
          - 최신 차트 오른쪽에 +26 미래영역을 확보해 구름대를 앞으로 표시
          - 사용자가 보내준 영웅문 일봉/분봉 화면을 기준으로 파란 채움 표시

          수박지표
          - 기존 초록/빨강 단순 바는 수박지표로 인정하지 않고 화면에서 제거
          - 실제 수박 수식/조건을 받기 전까지 수박 신호는 '사용자 수식 입력 대기'로 표시

          UI/분석
          - '고급 주문' 명칭을 '직접 주문'으로 변경
          - 메인 단타/역매공파/밥그릇3번 분석 카드에 '이유:' 한 줄 추가
          - 오른쪽 상세 분석에도 '간단 이유' 행 추가
          - 단타: 기준선/EMA/거래량/돌파·눌림을 간단 이유로 요약
          - 역매공파: 역배열/매집/공구리/상단안착/파란점선 상태를 요약
          - 밥그릇3번: 224EMA 아래/돌파/안착/눌림 상태를 요약
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip PUMA_STOCK_PRO_v1.4
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.4.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip",
            "notes": "v1.4: 영웅문 일봉/분봉 참고 1차 반영. 일목 선행스팬1·2 파란 구름대 추가, 잘못 만든 임시 수박바 제거, 고급주문→직접주문, 분석 결과마다 간단한 이유 표시.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.4_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.4.0"
          git push
