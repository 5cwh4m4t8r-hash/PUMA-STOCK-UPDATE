name: Snapshot PUMA v1.5 source
on:
  push:
    paths:
      - "release/snapshot-v15.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v1.5 /tmp/puma_v15
          mkdir -p /tmp/puma_v15 source/v1.5
          unzip -q releases/PUMA_STOCK_PRO_v1.5_UPDATE.zip -d /tmp/puma_v15
          cp -r /tmp/puma_v15/PUMA_STOCK_PRO_v1.5/puma_trader source/v1.5/
          cp /tmp/puma_v15/PUMA_STOCK_PRO_v1.5/app.py source/v1.5/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v1.5
          git commit -m "Snapshot PUMA v1.5 source"
          git push
