name: Snapshot PUMA v2.1 source
on:
  push:
    paths:
      - "release/snapshot-v21.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v2.1 /tmp/puma_v21
          mkdir -p /tmp/puma_v21 source/v2.1
          unzip -q releases/PUMA_STOCK_PRO_v2.1_UPDATE.zip -d /tmp/puma_v21
          cp -r /tmp/puma_v21/PUMA_STOCK_PRO_v2.1/puma_trader source/v2.1/
          cp /tmp/puma_v21/PUMA_STOCK_PRO_v2.1/app.py source/v2.1/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v2.1
          git commit -m "Snapshot PUMA v2.1 source"
          git push
