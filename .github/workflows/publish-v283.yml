name: Publish PUMA STOCK PRO v2.8.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/source_build/v2.8.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source_build/v2.8.3/requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r source_build/v2.8.3/requirements.txt pytest
      - name: Compile all Python sources
        run: python -m compileall -q source_build/v2.8.3
      - name: Run full test suite
        run: python -m pytest -q source_build/v2.8.3/tests
      - name: Build update ZIP and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PUMA_STOCK_PRO_v2.8.3
          cp -a source_build/v2.8.3 /tmp/PUMA_STOCK_PRO_v2.8.3
          find /tmp/PUMA_STOCK_PRO_v2.8.3 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find /tmp/PUMA_STOCK_PRO_v2.8.3 -name '*.pyc' -delete
          mkdir -p releases release
          rm -f releases/PUMA_STOCK_PRO_v2.8.3_UPDATE.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/PUMA_STOCK_PRO_v2.8.3_UPDATE.zip" PUMA_STOCK_PRO_v2.8.3)
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.8.3_UPDATE.zip | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']
          manifest={
              'version':'2.8.3',
              'url':'https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.8.3_UPDATE.zip',
              'notes':'v2.8.3: 외부 호스팅 없이 PC PUMA가 직접 제공하는 작동형 모바일 데모를 추가했습니다. 모바일 연동 탭의 데모 주소를 Safari로 열어 자동매매 흐름을 버튼으로 체험할 수 있습니다.',
              'sha256':sha,
          }
          body=json.dumps(manifest,ensure_ascii=False,indent=2)+chr(10)
          open('manifest.json','w',encoding='utf-8').write(body)
          open('manifest-v271.json','w',encoding='utf-8').write(body)
          release={
              'version':'2.8.3',
              'sha256':sha,
              'tests':'full pytest suite including local interactive mobile demo HTTP tests',
              'source':'source_build/v2.8.3',
              'features':[
                  'built-in local interactive mobile demo',
                  'no external demo hosting',
                  'demo auto buy/hold/trailing/sell simulation',
                  'demo never calls Kiwoom order API'
              ]
          }
          open('release/v2.8.3.json','w',encoding='utf-8').write(json.dumps(release,ensure_ascii=False,indent=2)+chr(10))
          PY
      - name: Publish tested update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PUMA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/PUMA_STOCK_PRO_v2.8.3_UPDATE.zip manifest.json manifest-v271.json release/v2.8.3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish PUMA STOCK PRO v2.8.3 local mobile demo'
          git push
