name: Publish PUMA v0.9

on:
  push:
    paths:
      - "release/v0.9.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v0.8_UPDATE.zip -d work
          cp source_build/v0.9/danta.py work/PUMA_STOCK_PRO_v0.8/puma_trader/danta.py
          cp source_build/v0.9/test_danta.py work/PUMA_STOCK_PRO_v0.8/tests/test_danta.py
          python scripts/upgrade_v08_to_v09.py

          cd work/PUMA_STOCK_PRO_v0.8
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          if grep -q "focus_day_signal" puma_trader/ui.py; then
            echo "focus_day_signal remains in main UI"
            exit 1
          fi
          if grep -q 'addTab(self.swing' puma_trader/ui.py; then
            echo "duplicate swing tab remains"
            exit 1
          fi
          grep -q 'addTab(self.strategy_widget, "단타 분석")' puma_trader/ui.py
          grep -q 'QScrollArea' puma_trader/ui.py
          grep -q 'analyze_danta' puma_trader/ui.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v0.8 work/PUMA_STOCK_PRO_v0.9
          cat > work/PUMA_STOCK_PRO_v0.9/CHANGELOG_v0.9.txt <<'EOF'
          PUMA STOCK PRO v0.9.0

          - 통합 트레이딩 오른쪽 분석/주문/자동매매 영역을 스크롤 구조로 변경
          - 작은 해상도에서도 주문/자동매매 버튼이 눌려 사라지지 않게 개선
          - 메인 통합 화면은 일봉 스윙/중장기 전용으로 정리
          - 역매공파 별도 중복 탭 제거, 메인 분석 결과/진행상태는 그대로 유지
          - 단타 분석 전용 탭 신설
          - 5분봉 기준선, EMA 5/20/60, 5분 거래량, 장초반 누적거래량, 최근고점 돌파, 눌림지지, 상승각도 점수화
          - 공개적으로 설명된 주식단테 단타 개념을 PUMA 방식으로 수치화한 해석판
          - 선택 종목은 단타 분석/고급 주문에도 즉시 연동
          EOF

          rm -f releases/PUMA_STOCK_PRO_v0.9_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v0.9_UPDATE.zip PUMA_STOCK_PRO_v0.9
          cd ..
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v0.9_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "0.9.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v0.9_UPDATE.zip",
            "notes": "v0.9: 오른쪽 패널 눌림/가림 수정, 역매공파 중복 탭 제거 및 메인 통합 유지, 별도 PUMA 단타 분석 화면 추가(5분봉·기준선·거래량·돌파/눌림 점수화).",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v0.9_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v0.9.0"
          git push
