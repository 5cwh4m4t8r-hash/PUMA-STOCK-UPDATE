name: Snapshot PUMA v1.9 source
on:
  push:
    paths:
      - "release/snapshot-v19.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v1.9 /tmp/puma_v19
          mkdir -p /tmp/puma_v19 source/v1.9
          unzip -q releases/PUMA_STOCK_PRO_v1.9_UPDATE.zip -d /tmp/puma_v19
          cp -r /tmp/puma_v19/PUMA_STOCK_PRO_v1.9/puma_trader source/v1.9/
          cp /tmp/puma_v19/PUMA_STOCK_PRO_v1.9/app.py source/v1.9/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v1.9
          git commit -m "Snapshot PUMA v1.9 source"
          git push
