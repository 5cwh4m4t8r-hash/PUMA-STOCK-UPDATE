name: Snapshot PUMA v1.0 source
on:
  push:
    paths:
      - "release/snapshot-v10.json"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/v1.0 /tmp/puma_v10
          mkdir -p /tmp/puma_v10 source/v1.0
          unzip -q releases/PUMA_STOCK_PRO_v1.0_UPDATE.zip -d /tmp/puma_v10
          cp -r /tmp/puma_v10/PUMA_STOCK_PRO_v1.0/puma_trader source/v1.0/
          cp /tmp/puma_v10/PUMA_STOCK_PRO_v1.0/app.py source/v1.0/app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/v1.0
          git commit -m "Snapshot PUMA v1.0 source"
          git push
