name: Publish PUMA STOCK PRO v2.7.3

on:
  push:
    branches: [main]
    paths:
      - 'source_build/v2.7.3/**'
      - '.github/workflows/publish-v273.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/source_build/v2.7.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source_build/v2.7.3/requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install -r source_build/v2.7.3/requirements.txt pytest

      - name: Compile all Python sources
        run: python -m compileall -q source_build/v2.7.3

      - name: Run full test suite
        run: python -m pytest -q source_build/v2.7.3/tests

      - name: Build update ZIP and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PUMA_STOCK_PRO_v2.7.3
          cp -a source_build/v2.7.3 /tmp/PUMA_STOCK_PRO_v2.7.3
          find /tmp/PUMA_STOCK_PRO_v2.7.3 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find /tmp/PUMA_STOCK_PRO_v2.7.3 -name '*.pyc' -delete
          mkdir -p releases release
          rm -f releases/PUMA_STOCK_PRO_v2.7.3_UPDATE.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/PUMA_STOCK_PRO_v2.7.3_UPDATE.zip" PUMA_STOCK_PRO_v2.7.3)
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.7.3_UPDATE.zip | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']
          manifest={
              'version':'2.7.3',
              'url':'https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.7.3_UPDATE.zip',
              'notes':'v2.7.3: 화살표 4종 시인성 개선, 검정 PUMA 근사 신호 추가, 수박근사를 바닥권·EMA112/224 눌림/재돌파 중심으로 재배치. 분석/주문 기준은 유지합니다.',
              'sha256':sha,
          }
          body=json.dumps(manifest,ensure_ascii=False,indent=2)+chr(10)
          open('manifest.json','w',encoding='utf-8').write(body)
          open('manifest-v271.json','w',encoding='utf-8').write(body)
          release={
              'version':'2.7.3',
              'sha256':sha,
              'tests':'full pytest suite',
              'source':'source_build/v2.7.3',
              'target_profile':'Intel Celeron N5095A / 12GB RAM',
              'features':['4-arrow high visibility renderer','black arrow PUMA proxy','watermelon proxy v2','signal-candle anchored watermelon']
          }
          open('release/v2.7.3.json','w',encoding='utf-8').write(json.dumps(release,ensure_ascii=False,indent=2)+chr(10))
          PY

      - name: Publish tested update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PUMA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/PUMA_STOCK_PRO_v2.7.3_UPDATE.zip manifest.json manifest-v271.json release/v2.7.3.json
          if git diff --cached --quiet; then
            echo 'No release changes.'
            exit 0
          fi
          git commit -m 'Publish PUMA STOCK PRO v2.7.3 arrows and watermelon update'
          git push
