name: Publish PUMA v0.6

on:
  push:
    paths:
      - "release/v0.6.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified update ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cat payload/v0.6.part*.b64 > /tmp/puma_v06.b64
          base64 -d /tmp/puma_v06.b64 > releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip
          echo "08c228c7ec98092d91ddec193023943124c68e04060388b4edb4cb45f4000f9d  releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip" | sha256sum -c -
          unzip -t releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip >/dev/null

      - name: Publish manifest
        shell: bash
        run: |
          cat > manifest.json <<'EOF'
          {
            "version": "0.6.0",
            "url": "https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v0.6_UPDATE.zip",
            "notes": "v0.6: 과거 차트 탐색/확대축소/좌우 이동/구간분석, 오돌이·역매공파·밥그릇3번 통합 전략판, 밥그릇3번 엔진 추가.",
            "sha256": "08c228c7ec98092d91ddec193023943124c68e04060388b4edb4cb45f4000f9d"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          rm -f payload/v0.6.part*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PUMA STOCK PRO v0.6.0"
          git push
