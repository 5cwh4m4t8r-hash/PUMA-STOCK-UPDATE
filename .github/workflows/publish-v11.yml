name: Publish PUMA v1.1

on:
  push:
    paths:
      - "release/v1.1.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify v1.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q releases/PUMA_STOCK_PRO_v1.0_UPDATE.zip -d work
          cp source_build/v1.1/classification.py work/PUMA_STOCK_PRO_v1.0/puma_trader/classification.py
          cp source_build/v1.1/watermelon.py work/PUMA_STOCK_PRO_v1.0/puma_trader/watermelon.py
          cp source_build/v1.1/test_v11.py work/PUMA_STOCK_PRO_v1.0/tests/test_v11.py
          python scripts/upgrade_v10_to_v11.py

          cd work/PUMA_STOCK_PRO_v1.0
          python -m py_compile app.py puma_trader/*.py
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q

          grep -q 'PUMA STOCK PRO v1.1' puma_trader/ui.py
          grep -q 'NumericComboBox' puma_trader/ui.py
          grep -q 'CandidateClassifier' puma_trader/ui.py
          grep -q '단타 DAY · 5분봉' puma_trader/ui.py
          grep -q 'watermelon' puma_trader/swing_chart.py
          grep -q '분류' puma_trader/ui.py
          grep -q 'CURRENT_VERSION = "1.1.0"' puma_trader/updater.py
          cd ../..

          mv work/PUMA_STOCK_PRO_v1.0 work/PUMA_STOCK_PRO_v1.1
          cat > work/PUMA_STOCK_PRO_v1.1/CHANGELOG_v1.1.txt <<'EOF'
          PUMA STOCK PRO v1.1.0

          통합 트레이딩
          - 조건검색 편입 종목을 PUMA 분석으로 단타/스윙/중장기/복합/관찰 분류
          - 분류 셀에 단타·스윙·중장기 점수 요약 툴팁 표시
          - 조건검색 편입 후 백그라운드 분석으로 분류 갱신
          - 메인 하단에 단타 DAY + 역매공파 SWING + 밥그릇3번 LONG 3전략 요약 통합
          - 메인 오른쪽 분석 탭에 단타 상세 요약 추가
          - 메인 차트에서 일봉/5분봉 전환 가능
          - 단타 상세분석 탭은 그대로 유지

          수박형 하단 지표
          - 차트 하단에 PUMA 수박형 짧은 초록/빨강 밴드 추가
          - 5분봉과 일봉 모두 표시
          - 타점 주변만 짧게 표시하고 바닥 전체를 연속 도색하지 않음
          - 공개 화면 개념을 참고한 PUMA 해석형이며 특정 비공개/유료 수식을 복제하지 않음

          입력 방식
          - 숫자 스핀박스를 휠 없는 직접입력 + 드롭다운 화살표 방식으로 전환
          - 마우스 휠로 숫자가 실수로 바뀌지 않음
          - 드롭다운에서 자주 쓰는 값을 고르거나 직접 입력 가능
          - 검색 시작/종료/청산 시각도 직접입력 + 드롭다운 방식으로 전환
          - 날짜 입력도 마우스 휠 변경 차단
          EOF

          rm -f releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip
          cd work
          zip -qr ../releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip PUMA_STOCK_PRO_v1.1
          cd ..
          unzip -t releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip >/dev/null
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "1.1.0",
            "url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip",
            "notes": "v1.1: 조건검색 종목 단타/스윙/중장기 자동분류, 메인에 단타 재통합(상세분석 유지), 차트 하단 PUMA 수박형 밴드, 숫자/시간 입력을 마우스휠 없는 직접입력+드롭다운 방식으로 변경.",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v1.1_UPDATE.zip manifest.json
          git commit -m "Publish PUMA STOCK PRO v1.1.0"
          git push
