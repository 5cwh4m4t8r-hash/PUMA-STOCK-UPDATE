name: Publish PUMA STOCK PRO v2.7.6

on:
  push:
    branches: [main]
    paths:
      - 'source_build/v2.7.6/**'
      - '.github/workflows/publish-v276.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/source_build/v2.7.6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source_build/v2.7.6/requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r source_build/v2.7.6/requirements.txt pytest
      - name: Compile all Python sources
        run: python -m compileall -q source_build/v2.7.6
      - name: Run full test suite
        run: python -m pytest -q source_build/v2.7.6/tests
      - name: Build update ZIP and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/PUMA_STOCK_PRO_v2.7.6
          cp -a source_build/v2.7.6 /tmp/PUMA_STOCK_PRO_v2.7.6
          find /tmp/PUMA_STOCK_PRO_v2.7.6 -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find /tmp/PUMA_STOCK_PRO_v2.7.6 -name '*.pyc' -delete
          mkdir -p releases release
          rm -f releases/PUMA_STOCK_PRO_v2.7.6_UPDATE.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/PUMA_STOCK_PRO_v2.7.6_UPDATE.zip" PUMA_STOCK_PRO_v2.7.6)
          SHA=$(sha256sum releases/PUMA_STOCK_PRO_v2.7.6_UPDATE.zip | awk '{print $1}')
          export SHA
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']
          manifest={
              'version':'2.7.6',
              'url':'https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.7.6_UPDATE.zip',
              'notes':'v2.7.6: 영웅문 화살표 위치 1차 정합. 같은 봉의 화살표를 동일 x좌표에 세로 적층하고 EAVG를 첫 과거값부터 누적하는 방식으로 수정했습니다. SAR 원식 값은 유지합니다.',
              'sha256':sha,
          }
          body=json.dumps(manifest,ensure_ascii=False,indent=2)+chr(10)
          open('manifest.json','w',encoding='utf-8').write(body)
          open('manifest-v271.json','w',encoding='utf-8').write(body)
          release={
              'version':'2.7.6',
              'sha256':sha,
              'tests':'full pytest suite',
              'source':'source_build/v2.7.6',
              'features':['exact-candle vertical arrow stacking','Hero-style cumulative EAVG']
          }
          open('release/v2.7.6.json','w',encoding='utf-8').write(json.dumps(release,ensure_ascii=False,indent=2)+chr(10))
          PY
      - name: Publish tested update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PUMA Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/PUMA_STOCK_PRO_v2.7.6_UPDATE.zip manifest.json manifest-v271.json release/v2.7.6.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish PUMA STOCK PRO v2.7.6 Hero arrow alignment'
          git push
