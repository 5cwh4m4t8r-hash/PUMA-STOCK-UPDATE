name: Publish PUMA v2.9.26 In-App Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v295-update.yml"
      - "source_build/v2.8.3/**"

concurrency:
  group: puma-in-app-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: cmd
        working-directory: source_build/v2.8.3
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile and import smoke test
        shell: cmd
        working-directory: source_build/v2.8.3
        run: |
          python -m compileall -q app.py puma_trader
          python -c "import puma_trader.engine, puma_trader.ui, puma_trader.gaboja, puma_trader.conditions, puma_trader.updater; print('PUMA v2.9.26 UPDATE SMOKE OK')"
          python -m pytest -q tests/test_v273_watermelon.py tests/test_v276_hero_arrows.py tests/test_v2925_arrow_consistency.py tests/test_v2912_visuals.py tests/test_v2913_swing_reference.py tests/test_v2914_condition_buckets.py tests/test_v2916_danta_pool.py tests/test_v2917_ui_logic.py tests/test_v2918_condition_name_normalization.py tests/test_v2919_bowl_chart_markers.py tests/test_v2920_danta_morning_strength.py tests/test_danta.py tests/test_gaboja_v284.py tests/test_gaboja_v290.py tests/test_v2921_bowl_confirm_and_union.py

      - name: Build update package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $PWD "source_build\v2.8.3"
          $pkg = Join-Path $PWD "_publish_v295"
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item (Join-Path $src "app.py") $pkg
          Copy-Item (Join-Path $src "requirements.txt") $pkg
          Copy-Item (Join-Path $src "PUMA_STOCK_PRO_ICON.svg") $pkg
          if (Test-Path (Join-Path $src "PUMA_STOCK_PRO.exe")) {
            Copy-Item (Join-Path $src "PUMA_STOCK_PRO.exe") $pkg
          }
          if (Test-Path (Join-Path $src "PUMA_STOCK_PRO.ico")) {
            Copy-Item (Join-Path $src "PUMA_STOCK_PRO.ico") $pkg
          }
          Copy-Item (Join-Path $src "puma_trader") $pkg -Recurse
          if (Test-Path (Join-Path $src "README_KO.txt")) {
            Copy-Item (Join-Path $src "README_KO.txt") $pkg
          }

          $releaseDir = Join-Path $PWD "releases"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zip = Join-Path $releaseDir "PUMA_STOCK_PRO_v2.9.26_UPDATE.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath $zip -CompressionLevel Optimal

          $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = "2.9.26"
            url = "https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.9.26_UPDATE.zip"
            notes = "v2.9.26: aligns PUMA's long-EMA calculations so the chart, four arrow formulas, Bowl-3, swing reference and market-path logic all use the same Hero-style cumulative EAVG engine. The user's four Kiwoom arrow formulas and SAR parameters remain unchanged; raw formula arrays are kept separately from display signals for direct HTS comparison. All price moving averages remain exponential (EAVG/EMA): 5, 20, 60, 112, 224 and 448. Black-arrow 224-period disparity is also evaluated against EMA224, matching the user's chart rule. New context rule: when EMA112>EMA224>EMA448 and price is already more than +8% above EMA224, reversal/bottom overlays are not used or shown (arrows, concrete boxes, Bowl-3 tags, watermelon/path/accumulation overlays and non-EMA extra lines). This fixes internal causes of arrows appearing on different crossings from the visible long EMAs while preserving the literal source formulas for diagnostics."
            sha256 = $sha
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $PWD "manifest.json") -Encoding UTF8
          Write-Host "SHA256=$sha"

      - name: Commit update package and manifest
        shell: powershell
        run: |
          git config user.name "PUMA Update Bot"
          git config user.email "puma-update@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v2.9.26_UPDATE.zip manifest.json
          if (git diff --cached --quiet) {
            Write-Host "No update files changed."
            exit 0
          }
          git commit -m "Publish PUMA STOCK PRO v2.9.26 in-app update"
          git pull --rebase origin main
          git push origin main
