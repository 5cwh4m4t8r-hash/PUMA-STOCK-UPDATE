name: Publish PUMA v2.9.18 In-App Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v295-update.yml"
      - "source_build/v2.8.3/**"

concurrency:
  group: puma-in-app-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: cmd
        working-directory: source_build/v2.8.3
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile and import smoke test
        shell: cmd
        working-directory: source_build/v2.8.3
        run: |
          python -m compileall -q app.py puma_trader
          python -c "import puma_trader.engine, puma_trader.ui, puma_trader.gaboja, puma_trader.conditions, puma_trader.updater; print('PUMA v2.9.18 UPDATE SMOKE OK')"
          python -m pytest -q tests/test_v273_watermelon.py tests/test_v2912_visuals.py tests/test_v2913_swing_reference.py tests/test_v2914_condition_buckets.py tests/test_v2916_danta_pool.py tests/test_v2917_ui_logic.py tests/test_v2918_condition_name_normalization.py

      - name: Build update package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $PWD "source_build\v2.8.3"
          $pkg = Join-Path $PWD "_publish_v295"
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item (Join-Path $src "app.py") $pkg
          Copy-Item (Join-Path $src "requirements.txt") $pkg
          Copy-Item (Join-Path $src "PUMA_STOCK_PRO_ICON.svg") $pkg
          if (Test-Path (Join-Path $src "PUMA_STOCK_PRO.exe")) {
            Copy-Item (Join-Path $src "PUMA_STOCK_PRO.exe") $pkg
          }
          if (Test-Path (Join-Path $src "PUMA_STOCK_PRO.ico")) {
            Copy-Item (Join-Path $src "PUMA_STOCK_PRO.ico") $pkg
          }
          Copy-Item (Join-Path $src "puma_trader") $pkg -Recurse
          if (Test-Path (Join-Path $src "README_KO.txt")) {
            Copy-Item (Join-Path $src "README_KO.txt") $pkg
          }

          $releaseDir = Join-Path $PWD "releases"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zip = Join-Path $releaseDir "PUMA_STOCK_PRO_v2.9.18_UPDATE.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath $zip -CompressionLevel Optimal

          $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = "2.9.18"
            url = "https://raw.githubusercontent.com/5cwh4m4t8r-hash/PUMA-STOCK-UPDATE/main/releases/PUMA_STOCK_PRO_v2.9.18_UPDATE.zip"
            notes = "v2.9.18: fixes false 'missing' status for the 5-minute day-trading condition search by canonicalizing Kiwoom condition names. Spaces, underscores, brackets, stars, hyphens and full-width punctuation are ignored consistently by both actual bundle selection and the UI missing-status check. Keeps the v2.9.17 integrated union UI, one-time LIVE START confirmation, source-isolated Day/Swing/Long lists, and Gaboja auto-trading flow."
            sha256 = $sha
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $PWD "manifest.json") -Encoding UTF8
          Write-Host "SHA256=$sha"

      - name: Commit update package and manifest
        shell: powershell
        run: |
          git config user.name "PUMA Update Bot"
          git config user.email "puma-update@users.noreply.github.com"
          git add releases/PUMA_STOCK_PRO_v2.9.18_UPDATE.zip manifest.json
          if (git diff --cached --quiet) {
            Write-Host "No update files changed."
            exit 0
          }
          git commit -m "Publish PUMA STOCK PRO v2.9.18 in-app update"
          git pull --rebase origin main
          git push origin main
