name: PUMAMobile
options:
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PUMAMobile:
    type: application
    platform: iOS
    sources:
      - path: PUMAMobile
    info:
      path: PUMAMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pumastock.mobile
        PRODUCT_NAME: PUMA Mobile
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
