<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PUMA Lingo</title>
<style>
:root{--bg:#0b0e12;--p:#141922;--p2:#1c2430;--l:#2b3646;--t:#f7f9fc;--m:#9ba8ba;--a:#6ee7f9;--a2:#86efac;--ok:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:22px;font-weight:900}.pill{font-size:13px;padding:8px 11px;border:1px solid var(--l);background:var(--p2);border-radius:999px}.hero,.card,.box{background:var(--p);border:1px solid var(--l);border-radius:24px}.hero{padding:20px}.hero h1{font-size:28px;margin:0 0 8px}.hero p,.muted{color:var(--m)}.barbg{height:9px;background:#080a0d;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:var(--m)}.section{font-weight:900;margin:22px 3px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.card b{display:block;margin-top:10px}.card small{color:var(--m)}button{font:inherit}.primary,.secondary{width:100%;padding:14px;border-radius:16px;font-weight:900;margin-top:10px}.primary{border:0;background:linear-gradient(90deg,var(--a),var(--a2));color:#071015}.secondary{border:1px solid var(--l);background:var(--p2);color:var(--t)}.screen{display:none}.screen.on{display:block}.head{display:flex;gap:10px;align-items:center;margin:8px 0 14px}.back{border:0;background:var(--p2);color:var(--t);padding:10px 13px;border-radius:13px}.head h2{margin:0}.box{padding:20px}.tag{display:inline-block;background:var(--a);color:#071015;font-weight:900;font-size:11px;padding:6px 9px;border-radius:999px;margin-bottom:14px}.big{font-size:28px;font-weight:900;line-height:1.25}.ans{width:100%;padding:14px;margin-top:13px;border-radius:14px;border:1px solid var(--l);background:#0e131b;color:var(--t)}.choice{width:100%;text-align:left;padding:13px;margin-top:9px;border-radius:14px;border:1px solid var(--l);background:#0e131b;color:var(--t)}.choice.ok{border-color:#2d8c70;background:#0d2a22}.choice.bad{border-color:#8b3448;background:#32151c}.feedback{margin-top:12px;padding:13px;border-radius:15px;display:none}.feedback.ok{display:block;background:#0d2a22;border:1px solid #2d8c70}.feedback.bad{display:block;background:#32151c;border:1px solid #8b3448}.mic{width:88px;height:88px;border:0;border-radius:50%;background:linear-gradient(145deg,var(--a),var(--a2));font-size:31px;display:block;margin:22px auto 12px}.trans{min-height:56px;border:1px solid var(--l);background:#0e131b;border-radius:14px;padding:13px;color:#c7d2df}.row{display:flex;gap:8px}.row>*{flex:1}.unit{padding:14px;border:1px solid var(--l);background:var(--p);border-radius:18px;margin-bottom:10px}.unit b{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,14,18,.96);backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);font-size:12px;padding:6px 0}.nav span{display:block;font-size:20px}.nav .sel{color:var(--t)}select{width:100%;padding:13px;border-radius:14px;background:#0e131b;color:var(--t);border:1px solid var(--l)}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen on">
<div class="top"><div class="brand">PUMA Lingo</div><div class="pill" id="langPill"></div></div>
<div class="hero"><h1>오늘 10분만 가자.</h1><p>듣고, 말하고, 틀린 건 다시.</p><div class="barbg"><div class="bar" id="dailyBar"></div></div><div class="muted" style="margin-top:7px">오늘 <b id="dailyText">0/10</b></div><button class="primary" onclick="start()">오늘 학습 시작</button></div>
<div class="stats"><div class="stat"><b id="xp">0</b><small>XP</small></div><div class="stat"><b id="streak">0</b><small>연속일</small></div><div class="stat"><b id="acc">0%</b><small>정답률</small></div></div>
<div class="section">빠른 학습</div><div class="grid">
<div class="card" onclick="show('course')">🧭<b>코스</b><small>상황별 문장</small></div>
<div class="card" onclick="show('review')">🔁<b>복습</b><small>오답 다시 보기</small></div>
<div class="card" onclick="pron()">🎙️<b>발음</b><small>seat / sit 구별</small></div>
<div class="card" onclick="show('me')">⚙️<b>설정</b><small>언어·목표</small></div>
</div></section>

<section id="course" class="screen"><div class="head"><button class="back" onclick="show('home')">←</button><h2>코스</h2></div><div id="units"></div></section>
<section id="lesson" class="screen"><div class="head"><button class="back" onclick="show('home')">×</button><h2 id="lessonNo">1/10</h2></div><div class="box" id="q"></div></section>
<section id="review" class="screen"><div class="top"><div class="brand">복습</div><div class="pill" id="due">0</div></div><div id="reviewList"></div></section>
<section id="pron" class="screen"><div class="head"><button class="back" onclick="show('home')">←</button><h2>영어 발음</h2></div><div class="box"><span class="tag">MINIMAL PAIRS</span><div class="big">비슷한 소리 비교</div><div id="pairs"></div></div></section>
<section id="me" class="screen"><div class="top"><div class="brand">내 학습</div></div><div class="box"><b>학습 언어</b><select id="langSel" onchange="setLang(this.value)"></select><div class="section">하루 목표</div><div class="row"><button class="secondary" onclick="goal(5)">5문제</button><button class="secondary" onclick="goal(10)">10문제</button><button class="secondary" onclick="goal(20)">20문제</button></div><p class="muted">iPhone Safari에서 공유 → 홈 화면에 추가하면 앱처럼 실행할 수 있습니다.</p></div></section>
</div>

<div class="nav"><button class="sel" onclick="nav('home',this)"><span>⌂</span>홈</button><button onclick="nav('course',this)"><span>◫</span>코스</button><button onclick="nav('review',this)"><span>↻</span>복습</button><button onclick="nav('me',this)"><span>👤</span>내 학습</button></div>

<script>
var D={
"en-US":{n:"English",f:"🇺🇸",u:[["기본",[["Hello.","안녕하세요."],["Thank you.","감사합니다."],["Excuse me.","실례합니다."],["Please say it slowly.","천천히 말해 주세요."]]],["이동·좌석",[["We can sit there.","우리는 거기에 앉을 수 있어요."],["I can sit there.","나는 거기에 앉을 수 있어요."],["Is this seat available?","이 자리 비어 있나요?"],["Where is gate twenty-two?","22번 게이트가 어디예요?"]]],["호텔",[["I have a reservation.","예약했습니다."],["Can I check in now?","지금 체크인할 수 있나요?"],["What time is check-out?","체크아웃은 몇 시예요?"],["Can I leave my luggage here?","짐을 맡겨도 될까요?"]]],["식당",[["A table for one, please.","한 명 자리 부탁합니다."],["Can I see the menu?","메뉴판을 볼 수 있을까요?"],["I'd like this one.","이걸로 주세요."],["Can I get the bill, please?","계산서 부탁합니다."]]]]},
"ja-JP":{n:"日本語",f:"🇯🇵",u:[["기본",[["こんにちは。","안녕하세요."],["ありがとうございます。","감사합니다."],["すみません。","실례합니다."],["ゆっくり話してください。","천천히 말해 주세요."]]],["이동·좌석",[["私たちはそこに座れます。","우리는 거기에 앉을 수 있어요."],["この席は空いていますか。","이 자리 비어 있나요?"],["22番ゲートはどこですか。","22번 게이트가 어디예요?"],["トイレはどこですか。","화장실이 어디예요?"]]],["호텔",[["予約しています。","예약했습니다."],["今チェックインできますか。","지금 체크인할 수 있나요?"],["チェックアウトは何時ですか。","체크아웃은 몇 시예요?"],["荷物を預けてもいいですか。","짐을 맡겨도 될까요?"]]]]},
"es-ES":{n:"Español",f:"🇪🇸",u:[["기본",[["Hola.","안녕하세요."],["Gracias.","감사합니다."],["No entiendo.","이해하지 못했어요."],["Hable más despacio, por favor.","천천히 말해 주세요."]]],["이동·좌석",[["Podemos sentarnos allí.","우리는 거기에 앉을 수 있어요."],["¿Está libre este asiento?","이 자리 비어 있나요?"],["¿Dónde está la puerta veintidós?","22번 게이트가 어디예요?"],["¿Dónde está el baño?","화장실이 어디예요?"]]],["호텔",[["Tengo una reserva.","예약했습니다."],["¿Puedo registrarme ahora?","지금 체크인할 수 있나요?"],["¿A qué hora es la salida?","체크아웃은 몇 시예요?"]]]]},
"fr-FR":{n:"Français",f:"🇫🇷",u:[["기본",[["Bonjour.","안녕하세요."],["Merci.","감사합니다."],["Je ne comprends pas.","이해하지 못했어요."],["Parlez plus lentement, s'il vous plaît.","천천히 말해 주세요."]]],["이동·좌석",[["Nous pouvons nous asseoir là.","우리는 거기에 앉을 수 있어요."],["Cette place est libre ?","이 자리 비어 있나요?"],["Où est la porte vingt-deux ?","22번 게이트가 어디예요?"]]]]},
"de-DE":{n:"Deutsch",f:"🇩🇪",u:[["기본",[["Hallo.","안녕하세요."],["Danke.","감사합니다."],["Ich verstehe nicht.","이해하지 못했어요."],["Bitte sprechen Sie langsamer.","천천히 말해 주세요."]]],["이동·좌석",[["Wir können dort sitzen.","우리는 거기에 앉을 수 있어요."],["Ist dieser Platz frei?","이 자리 비어 있나요?"],["Wo ist die Toilette?","화장실이 어디예요?"]]]]},
"zh-CN":{n:"中文",f:"🇨🇳",u:[["기본",[["你好。","안녕하세요."],["谢谢。","감사합니다."],["我听不懂。","이해하지 못했어요."],["请说慢一点。","천천히 말해 주세요."]]],["이동·좌석",[["我们可以坐在那里。","우리는 거기에 앉을 수 있어요."],["这个座位有人吗？","이 자리 비어 있나요?"],["洗手间在哪里？","화장실이 어디예요?"]]]]}
};
var S=JSON.parse(localStorage.getItem("pumaLingoLive")||'{"lang":"en-US","xp":0,"streak":0,"last":"","goal":10,"done":{},"ok":0,"total":0,"bad":[]}'),flat=[],sess=null;
function save(){localStorage.setItem("pumaLingoLive",JSON.stringify(S));home()}
function day(){return new Date().toISOString().slice(0,10)}
function makeFlat(){flat=[];D[S.lang].u.forEach(function(u,ui){u[1].forEach(function(x,ii){flat.push({id:ui+"-"+ii,t:x[0],k:x[1],u:ui})})})}
function home(){makeFlat();document.getElementById("langPill").textContent=D[S.lang].f+" "+D[S.lang].n;document.getElementById("xp").textContent=S.xp;document.getElementById("streak").textContent=S.streak;document.getElementById("acc").textContent=(S.total?Math.round(S.ok/S.total*100):0)+"%";var n=S.done[day()]||0;document.getElementById("dailyText").textContent=n+"/"+S.goal;document.getElementById("dailyBar").style.width=Math.min(100,n/S.goal*100)+"%";document.getElementById("due").textContent=S.bad.length+"개";units();settings();reviews()}
function show(id){document.querySelectorAll(".screen").forEach(function(e){e.classList.remove("on")});document.getElementById(id).classList.add("on")}
function nav(id,b){show(id);document.querySelectorAll(".nav button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")}
function units(){var b=document.getElementById("units");b.innerHTML="";D[S.lang].u.forEach(function(u,i){var d=document.createElement("div");d.className="unit";d.innerHTML="<b>"+u[0]+"</b><span class='muted'>"+u[1].length+"문장</span><button class='secondary'>연습 시작</button>";d.querySelector("button").onclick=function(){start(i)};b.appendChild(d)})}
function settings(){var s=document.getElementById("langSel");s.innerHTML="";Object.keys(D).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=D[k].f+" "+D[k].n;o.selected=k===S.lang;s.appendChild(o)})}
function setLang(v){S.lang=v;save();show("home")}
function goal(n){S.goal=n;save();alert("하루 목표를 "+n+"문제로 바꿨어요.")}
function start(ui){makeFlat();var p=ui===undefined?flat:flat.filter(function(x){return x.u===ui});p=p.slice().sort(function(){return Math.random()-.5}).slice(0,S.goal);sess={p:p,i:0,c:0};show("lesson");question()}
function question(){if(sess.i>=sess.p.length)return finish();var x=sess.p[sess.i],m=sess.i%4;document.getElementById("lessonNo").textContent=(sess.i+1)+"/"+sess.p.length;var q=document.getElementById("q");q.innerHTML="";
if(m===0){var opts=[x.k];flat.filter(function(y){return y.id!==x.id}).sort(function(){return Math.random()-.5}).slice(0,3).forEach(function(y){opts.push(y.k)});opts.sort(function(){return Math.random()-.5});q.innerHTML="<span class='tag'>뜻 고르기</span><div class='big'>"+x.t+"</div>";opts.forEach(function(o){var b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=function(){grade(o===x.k,x);b.classList.add(o===x.k?"ok":"bad");nextBtn()};q.appendChild(b)})}
else if(m===1){q.innerHTML="<span class='tag'>듣기</span><div class='big'>듣고 문장을 입력하세요.</div><button class='mic' id='play'>🔊</button><input class='ans' id='ans'><button class='primary' id='check'>확인</button><div class='feedback' id='fb'></div>";document.getElementById("play").onclick=function(){speak(x.t)};document.getElementById("check").onclick=function(){typed(x)};setTimeout(function(){speak(x.t)},250)}
else if(m===2&&S.lang==="en-US"){q.innerHTML="<span class='tag'>말하기</span><div class='big'>"+x.t+"</div><div class='muted'>"+x.k+"</div><button class='mic' id='mic'>🎙️</button><div class='trans' id='tr'>마이크를 누르고 말해보세요.</div><div class='feedback' id='fb'></div><button class='secondary' id='model'>🔊 정답 듣기</button>";document.getElementById("mic").onclick=function(){rec(x)};document.getElementById("model").onclick=function(){speak(x.t)}}
else{q.innerHTML="<span class='tag'>문장 만들기</span><div class='big'>"+x.k+"</div><input class='ans' id='ans'><button class='primary' id='check'>확인</button><div class='feedback' id='fb'></div><button class='secondary' id='hint'>🔊 정답 듣기</button>";document.getElementById("check").onclick=function(){typed(x)};document.getElementById("hint").onclick=function(){speak(x.t)}}}
function norm(s){return (s||"").toLowerCase().replace(/[.,!?¿¡"'’。，？！]/g,"").replace(/\s+/g," ").trim()}
function similar(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;var d=Array.from({length:a.length+1},function(){return Array(b.length+1).fill(0)});for(var i=0;i<=a.length;i++)d[i][0]=i;for(var j=0;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.max(0,Math.round((1-d[a.length][b.length]/Math.max(a.length,b.length))*100))}
function typed(x){var sc=similar(document.getElementById("ans").value,x.t),ok=sc>=80,fb=document.getElementById("fb");fb.className="feedback "+(ok?"ok":"bad");fb.innerHTML="<b>"+sc+"%</b><br>"+(ok?"좋아요.":"정답: "+x.t);grade(ok,x);nextBtn()}
function rec(x){var R=window.SpeechRecognition||window.webkitSpeechRecognition,tr=document.getElementById("tr"),fb=document.getElementById("fb");if(!R){tr.textContent="이 iPhone/Safari에서는 음성 인식이 지원되지 않거나 권한이 꺼져 있습니다.";return}var r=new R();r.lang=S.lang;r.interimResults=true;r.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;tr.textContent=t;if(e.results[e.results.length-1].isFinal){var sc=similar(t,x.t),ok=sc>=76;fb.className="feedback "+(ok?"ok":"bad");fb.innerHTML="<b>"+sc+"%</b><br>"+(ok?"잘 전달됐어요.":"목표: "+x.t);grade(ok,x);nextBtn()}};r.onerror=function(e){tr.textContent="마이크 오류: "+e.error};r.start()}
function grade(ok,x){S.total++;if(ok){S.ok++;S.xp+=10;sess.c++}else{S.xp+=2;S.bad.unshift({id:x.id,t:x.t,k:x.k});S.bad=S.bad.slice(0,60)}save()}
function nextBtn(){if(document.getElementById("next"))return;var b=document.createElement("button");b.id="next";b.className="primary";b.textContent="다음";b.onclick=function(){sess.i++;question()};document.getElementById("q").appendChild(b)}
function finish(){var t=day();if(S.last!==t){var y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===y.toISOString().slice(0,10)?S.streak+1:1;S.last=t}S.done[t]=(S.done[t]||0)+sess.p.length;save();alert("학습 완료! "+sess.c+"/"+sess.p.length+" 정답");show("home")}
function speak(t){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=S.lang;u.rate=.88;speechSynthesis.speak(u)}
function reviews(){var b=document.getElementById("reviewList");if(!S.bad.length){b.innerHTML="<div class='hero'><h1>오답이 없어요.</h1><p>틀린 문장이 생기면 여기에 저장됩니다.</p></div>";return}var seen={};b.innerHTML="<button class='primary' onclick='start()'>복습 세션 시작</button><div class='section'>최근 오답</div>";S.bad.forEach(function(x){if(seen[x.id])return;seen[x.id]=1;var d=document.createElement("div");d.className="unit";d.innerHTML="<b>"+x.t+"</b><span class='muted'>"+x.k+"</span>";b.appendChild(d)})}
function pron(){if(S.lang!=="en-US"){alert("현재 발음 비교는 영어에서 지원해요.");return}show("pron");var a=[["seat","sit"],["sit","shit"],["ship","sheep"],["live","leave"]],b=document.getElementById("pairs");b.innerHTML="";a.forEach(function(p){var d=document.createElement("div");d.className="unit";d.innerHTML="<b>"+p[0]+" ↔ "+p[1]+"</b><div class='row'><button class='secondary'>"+p[0]+" 듣기</button><button class='secondary'>"+p[1]+" 듣기</button></div>";var z=d.querySelectorAll("button");z[0].onclick=function(){speak(p[0])};z[1].onclick=function(){speak(p[1])};b.appendChild(d)})}
home();
</script>
</body>
</html>
